<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentHub Login</title>
    <link rel="stylesheet" href="../Css/login.css" />
  </head>

  <body>
    <center>
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_msVTJ1UZqmtO-rMykxXBRws_5_EmYQxh7ZsTVTWeQoeh8BjRmlV7sLk&s=10"
        alt="StudentHub Logo"
        width="150"
      />

      <h1>StudentHub Portal</h1>
      <h3>Welcome Back</h3>

      <p>
        Don't have an account?
        <a href="register.html">Register Here</a>
      </p>
    </center>

    <hr />

    <form id="loginForm">
      <center>
        <p><b> Login</b></p>

        <table>
          <tr>
            <td><label for="email">Email</label></td>
            <td>
              <input
                type="email"
                id="email"
                placeholder="Enter Your Email"
                required
              />
            </td>
          </tr>

          <tr>
            <td><label for="password">Password</label></td>
            <td>
              <input
                type="password"
                id="password"
                placeholder="Enter Your Password"
                required
              />
            </td>
          </tr>

          <tr>
            <td colspan="2" align="right">
              <a href="#">Forgot Password?</a>
            </td>
          </tr>

          <tr>
            <td colspan="2" align="center">
              <input type="checkbox" id="remember" />
              <label for="remember">Remember Me</label>
            </td>
          </tr>

          <tr>
            <td colspan="2" align="center">
           <button type="submit" class="login-button">Login</button>
                    <button type="reset">Clear</button>    
            </td>
          </tr>
        </table>
      </center>
    </form>

    <hr />

    <center>
      <p>
        New User?
        <a href="register.html">Create an Account</a>
      </p>

      <small>
        <p>&copy; 2026 StudentHub. All Rights Reserved.</p>
      </small>
    </center>
    <div class="login-popup" id="loginPopup">

    <div class="login-success-box">

        <button class="close-login-popup" id="closeLoginPopup">&times;</button>

        <div class="login-success-icon">✓</div>

        <h2>Welcome Back!</h2>

        <p>You have logged in successfully.</p>

        <button class="login-continue-btn" id="loginContinueBtn">
            Continue to Dashboard
        </button>

    </div>

</div>

    <script src="../Java Script/login.js"></script>
  </body>
</html>
